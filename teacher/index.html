async function signIn(){
  const btn=$('button[onclick="window.signIn()"]');
  const email=$('#authEmail')?.value.trim().toLowerCase()||'';
  const password=$('#authPass')?.value||'';
  if(!email||!password)return toast('กรุณากรอกอีเมลและรหัสผ่าน');
  if(!supa)return toast('ยังเชื่อมต่อ Supabase ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บแล้วลองใหม่');
  if(btn){btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ…';}
  try{
    const {data,error}=await supa.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data?.user)throw new Error('เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน');

    if(invite){
      const x=await supa.rpc('accept_classroom_invite',{p_token:invite});
      if(x.error)throw x.error;
      history.replaceState({},'',location.pathname);
      await loadTeacher();
      toast('เข้าร่วมห้องเรียนเรียบร้อยแล้ว');
    }
    renderTeacher();
  }catch(e){
    console.error('STAR UP teacher sign-in error:',e);
    const msg=e?.message||String(e);
    if(/invalid login credentials/i.test(msg))toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    else if(/email not confirmed/i.test(msg))toast('กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ');
    else toast('เข้าสู่ระบบไม่สำเร็จ: '+msg);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='เข้าสู่ระบบครู';}
  }
}

issionSubmissions.filter(q=>q.status==='pending').length}</span>`:''}`],['teachers','👩‍🏫 ทีมครู']].map(([id,t])=>`<button class="tab ${view===id?'active':''}" onclick="setView('${id}')">${t}</button>`).join('')}</nav><main>${teacherContent()}</main><div class="profilefoot">STAR UP! • ทุกคนมีดาวเป็นของตัวเอง</div></div>`}

function missionDeadline(m){return m.is_urgent&&m.urgent_until?new Date(m.urgent_until):m.due_at?new Date(m.due_at):null}
function missionIsExpired(m,now=new Date()){let deadline=missionDeadline(m);return !!(deadline&&!Number.isNaN(deadline.getTime())&&deadline.getTime()<=now.getTime())}
function missionTimeLeft(m,now=new Date()){let deadline=missionDeadline(m);if(!deadline)return 'ไม่จำกัดเวลา';let ms=deadline.getTime()-now.getTime();if(ms<=0)return 'หมดเวลาแล้ว';let days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000),secs=Math.floor(ms%60000/1000);return `${days?days+' วัน ':''}${hours} ชม. ${mins} นาที ${secs} วินาที`}
function startMissionCountdownTicker(){if(window.__starupMissionTicker)return;window.__starupMissionTicker=setInterval(()=>{let now=new Date(),expired=false;document.querySelectorAll('[data-mission-deadline]').forEach(el=>{let ms=Number(el.dataset.missionDeadline)-now.getTime();if(ms<=0){el.textContent='หมดเวลาแล้ว';expired=true}else{let d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000),sec=Math.floor(ms%60000/1000);el.textContent=`${d?d+' วัน ':''}${h} ชม. ${m} นาที ${sec} วินาที`}});if(expired&&!window.__starupMissionExpiryRefresh){window.__starupMissionExpiryRefresh=true;setTimeout(async()=>{try{if(!isDemo())await loadRoom();renderTeacher(isDemo())}finally{window.__starupMissionExpiryRefresh=false}},1000)}},1000)}
function renderClassroomActivityDashboard(){
 let ss=currentStudents(),total=ss.length,now=new Date();
 let cards=missions.map(m=>{let subs=missionSubmissions.filter(q=>q.mission_id===m.id),latest=new Map();subs.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(q=>latest.set(q.student_id,q));let states=[...latest.values()],approved=states.filter(q=>q.status==='approved').length,pending=states.filter(q=>q.status==='pending').length,rejected=states.filter(q=>q.status==='rejected').length,submitted=states.length,missing=Math.max(0,total-submitted),pct=total?Math.round(approved/total*100):0,expired=missionIsExpired(m,now);return {m,approved,pending,rejected,submitted,missing,pct,subs,latest,expired,deadline:missionDeadline(m)}});
 let active=cards.filter(x=>x.m.active!==false&&!x.expired),history=cards.filter(x=>x.m.active===false||x.expired);
 let historyOpen=!!window.missionDashboardHistory,pendingEvidence=missionSubmissions.filter(q=>q.status==='pending').length,pendingRewards=requests.filter(r=>r.status==='pending').length;
 let renderCard=x=>{let deadline=x.deadline,deadlineAttr=deadline&&!x.expired&&x.m.active!==false&&!Number.isNaN(deadline.getTime())?`data-mission-deadline="${deadline.getTime()}"`:'';return `<article class="mission-overview-card"><div class="mission-overview-head"><div class="mission-overview-title"><span class="mission-overview-icon">${esc(x.m.emoji||'⭐')}</span><div><strong>${esc(x.m.title)}</strong><div class="tiny muted">${esc(x.m.category||'ภารกิจทั่วไป')} · ส่งแล้ว ${x.submitted}/${total} คน</div></div></div><span class="badge">${x.pct}% อนุมัติ</span></div><div class="mission-progress"><div style="width:${x.pct}%"></div></div><div class="mission-state-pills"><span class="badge" style="background:#e3f7eb;color:#237b4e">สำเร็จ ${x.approved}</span><span class="badge" style="background:#fff3d8;color:#94600e">รอตรวจ ${x.pending}</span><span class="badge" style="background:#fde8eb;color:#a43d54">ยังไม่ส่ง ${x.missing}</span><span class="badge" style="background:#eeeaff;color:#6054bd">ต้องแก้ไข ${x.rejected}</span></div><div class="tiny muted mission-time">${deadline?`⏳ เวลาที่เหลือ: <strong ${deadlineAttr}>${esc(missionTimeLeft(x.m,now))}</strong>`:'⏳ ไม่จำกัดเวลา'}${x.expired?' · หมดเวลาแล้ว':x.m.active===false?' · ครูปิดภารกิจ':''}</div><div class="actions mission-actions"><button class="btn soft small" onclick="openActivityRoster('${x.m.id}')">ดูรายชื่อนักเรียน</button>${x.pending?`<button class="btn green small" onclick="bulkReviewMission('${x.m.id}',true)">อนุมัติทั้งหมด (${x.pending})</button><button class="btn red small" onclick="bulkReviewMission('${x.m.id}',false)">ปฏิเสธทั้งหมด (${x.pending})</button>`:''}</div></article>`};
 return `<section class="panel classroom-overview-panel" style="margin-bottom:14px"><div class="split"><div><h3 class="classroom-section-title">📊 ภาพรวมกิจกรรมทั้งห้อง</h3><div class="tiny muted">สรุปข้อมูลนักเรียน ภารกิจ และรายการที่รอครูอนุมัติในห้องนี้</div></div><button class="btn primary" onclick="openMissionForm()">＋ สร้างกิจกรรมทั้งห้อง</button></div><div class="grid stats classroom-summary-grid"><div class="stat"><div class="ico">👩‍🎓</div><div><b>${total}</b><small>นักเรียนทั้งหมด</small></div></div><div class="stat"><div class="ico">📚</div><div><b>${active.length}</b><small>ภารกิจที่เปิดใช้งาน</small></div></div><div class="stat"><div class="ico">⏳</div><div><b>${pendingEvidence}</b><small>หลักฐานภารกิจรออนุมัติ</small></div></div><div class="stat"><div class="ico">🎁</div><div><b>${pendingRewards}</b><small>คำขอแลกรางวัลรออนุมัติ</small></div></div></div></section><section class="panel mission-status-panel"><div class="mission-status-banner"><div class="mission-status-banner-icon">📋</div><div><h3 class="classroom-section-title">สถานะภารกิจ</h3><div>ข้อมูลจากหน้าภารกิจของห้องเรียน</div></div><span class="mission-status-count">${active.length} ภารกิจ</span></div><div class="mission-card-list">${active.length?active.map(renderCard).join(''):'<div class="empty">🎉 ไม่มีภารกิจที่กำลังดำเนินอยู่ในขณะนี้</div>'}</div><div class="split mission-history-head"><div><strong>🗂️ ประวัติภารกิจ</strong><div class="tiny muted">ภารกิจที่หมดเวลาหรือครูปิดไว้ จะเก็บประวัติและหลักฐานเดิมทั้งหมด</div></div><button class="btn soft" onclick="window.missionDashboardHistory=!window.missionDashboardHistory;renderTeacher(isDemo())">${historyOpen?'ซ่อนประวัติ':'ดูประวัติภารกิจ'}</button></div>${historyOpen?(history.length?`<div class="mission-card-list">${history.map(renderCard).join('')}</div>`:'<div class="empty">ยังไม่มีภารกิจในประวัติ</div>'):''}</section>`

function openActivityRoster(missionId){let m=missions.find(x=>x.id===missionId);if(!m)return;let subs=missionSubmissions.filter(q=>q.mission_id===missionId);let rows=currentStudents().map(st=>{let q=subs.filter(x=>x.student_id===st.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0],status=q?.status||'missing',label={approved:'อนุมัติแล้ว',pending:'รอตรวจ',rejected:'ต้องแก้ไข',missing:'ยังไม่ส่ง'}[status],color={approved:'success',pending:'warning',rejected:'info',missing:'danger'}[status];return `<div class="listrow"><div><strong>${esc(st.full_name)}</strong><div class="tiny muted">${q?new Date(q.created_at).toLocaleString('th-TH'):'ไม่มีรายการส่ง'}</div></div><span class="badge" style="background:${color==='success'?'#e3f7eb':color==='warning'?'#fff3d8':color==='info'?'#eeeaff':'#fde8eb'}">${label}</span></div>`}).join('');modal(`<h3>👥 ${esc(m.title)} — รายชื่อนักเรียน</h3><div class="tiny muted">แสดงสถานะล่าสุดของนักเรียนแต่ละคน</div>${rows||'<div class="empty">ไม่มีนักเรียนในห้อง</div>'}<div class="modalfoot"><button class="btn white" onclick="closeModal()">ปิด</button></div>`)}
async function bulkReviewMission(missionId,approve){let ids=missionSubmissions.filter(q=>q.mission_id===missionId&&q.status==='pending').map(q=>q.id);if(!ids.length)return toast('ไม่พบรายการรอตรวจ');let m=missions.find(x=>x.id===missionId);askConfirmButtons(`ยืนยัน${approve?'อนุมัติ':'ปฏิเสธ'}หลักฐานกิจกรรม “${m?.title||''}” จำนวน ${ids.length} รายการหรือไม่?`,'ยืนยัน',async()=>{let done=0;try{for(const id of ids){let {error}=await supa.rpc('teacher_review_mission',{p_submission_id:id,p_approve:approve,p_note:''});if(error)throw error;done++}await loadRoom();renderTeacher();toast(`${approve?'อนุมัติ':'ปฏิเสธ'}สำเร็จ ${done} รายการ`)}catch(e){await loadRoom();renderTeacher();toast(`ดำเนินการสำเร็จ ${done}/${ids.length} รายการ: ${friendlyErr(e)}`)}})}

 <div style="max-height:42vh;overflow:auto">${items.map(r=>`<label class="listrow" style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" class="reward-lib-check" value="${r.id}" style="width:20px;height:20px"><span style="font-size:26px">${esc(r.emoji||'🎁')}</span><span style="flex:1"><b>${esc(r.name)}</b><div class="tiny muted">${esc(r.description||'')} • ${money(r.cost)} ⭐ • คงเหลือเริ่มต้น ${r.stock}</div></span><button type="button" class="btn white small" onclick="event.preventDefault();event.stopPropagation();openLibraryForm('${r.id}')">แก้ไข</button></label>`).join('')||'<div class="empty">ยังไม่มีของรางวัลในคลัง</div>'}</div>
 <div class="modalfoot"><button class="btn white" onclick="closeModal()">ปิด</button><button class="btn primary" onclick="assignSelectedLibraryRewards()">เพิ่มรายการที่เลือกเข้าห้องนี้</button></div>`);
}
function openLibraryForm(id=''){
 const r=rewardLibrary.find(x=>x.id===id);
 modal(`<h3>${r?'แก้ไขรายการในคลัง':'เพิ่มของรางวัลเข้าคลัง'} 📚</h3>
 <div class="fieldrow"><label>ชื่อของรางวัล</label><input class="field" id="libName" value="${esc(r?.name||'')}" placeholder="เช่น iPhone 18 Pro Max"></div>
 <div class="fieldrow"><label>รายละเอียด</label><input class="field" id="libDesc" value="${esc(r?.description||'')}" placeholder="รายละเอียดของรางวัล"></div>
 <div class="grid" style="grid-template-columns:1fr 1fr"><div class="fieldrow"><label>ไอคอน</label><input class="field" id="libEmoji" value="${esc(r?.emoji||'🎁')}" maxlength="5"></div><div class="fieldrow"><label>ราคา (ดาว)</label><input class="field" id="libCost" type="number" min="1" value="${r?.cost??1000}"></div></div>
 <div class="fieldrow"><label>จำนวนเริ่มต้นในแต่ละห้อง</label><input class="field" id="libStock" type="number" min="0" value="${r?.stock??1}"></div>
 <div class="modalfoot"><button class="btn white" onclick="openRewardLibrary()">ย้อนกลับ</button>${r?`<button class="btn red" onclick="deleteLibraryItem('${r.id}')">ลบ</button>`:''}<button class="btn primary" onclick="saveLibraryItem('${id}')">บันทึกในคลัง</button></div>`);
}
async function saveLibraryItem(id){
 const row={name:$('#libName').value.trim(),description:$('#libDesc').value.trim(),emoji:$('#libEmoji').value.trim()||'🎁',cost:Number($('#libCost').value),stock:Number($('#libStock').value),active:true};
 if(!row.name||!Number.isInteger(row.cost)||row.cost<1||!Number.isInteger(row.stock)||row.stock<0)return toast('กรุณาตรวจสอบชื่อ ราคา และจำนวน');
 try{
  if(isDemo()){if(id)Object.assign(rewardLibrary.find(x=>x.id===id),row);else rewardLibrary.unshift({...row,id:'lib'+Date.now()});demo.rewardLibrary=rewardLibrary;saveDemo();}
  else {const q=id?supa.from('reward_library').update(row).eq('id',id).eq('teacher_id',user.id):supa.from('reward_library').insert({...row,teacher_id:user.id});if(q.error)throw q.error;const {error}=await q;if(error)throw error;const {data,error:er}=await supa.from('reward_library').select('*').eq('teacher_id',user.id).order('created_at',{ascending:false});if(er)throw er;rewardLibrary=data||[];}
  openRewardLibrary();toast('บันทึกคลังของรางวัลแล้ว');
 }catch(e){toast(e.message||'บันทึกไม่สำเร็จ')}
}
async function deleteLibraryItem(id){
 if(!confirm('ลบรายการนี้ออกจากคลัง? ของรางวัลที่เพิ่มไว้ในห้องต่าง ๆ จะไม่ถูกลบ'))return;
 try{if(isDemo()){rewardLibrary=rewardLibrary.filter(x=>x.id!==id);demo.rewardLibrary=rewardLibrary;saveDemo();}
 else{const {error}=await supa.from('reward_library').delete().eq('id',id).eq('teacher_id',user.id);if(error)throw error;rewardLibrary=rewardLibrary.filter(x=>x.id!==id)}
 openRewardLibrary();toast('ลบออกจากคลังแล้ว');
 }catch(e){toast(e.message)}
}
async function saveCurrentRewardsToLibrary(){
 const existing=new Set((rewardLibrary||[]).map(x=>x.name.trim().toLowerCase()));
 const fresh=rewards.filter(r=>!existing.has(r.name.trim().toLowerCase()));
 if(!fresh.length)return toast('ของรางวัลห้องนี้มีอยู่ในคลังแล้ว');
 try{for(const r of fresh){const row={name:r.name,description:r.description||'',emoji:r.emoji||'🎁',cost:r.cost,stock:r.stock,active:true};
 if(isDemo())rewardLibrary.push({...row,id:'lib'+Date.now()+Math.random()});
 else{const {error}=await supa.from('reward_library').insert({...row,teacher_id:user.id});if(error)throw error;}}
 if(isDemo()){demo.rewardLibrary=rewardLibrary;saveDemo()}else{const {data,error}=await supa.from('reward_library').select('*').eq('teacher_id',user.id).order('created_at',{ascending:false});if(error)throw error;rewardLibrary=data||[]}
 openRewardLibrary();toast(`บันทึกเข้าคลัง ${fresh.length} รายการแล้ว`);
 }catch(e){toast(e.message)}
}
async function assignSelectedLibraryRewards(){
 const ids=$$('.reward-lib-check:checked').map(x=>x.value);
 if(!ids.length)return toast('เลือกของรางวัลอย่างน้อย 1 รายการ');
 const selected=rewardLibrary.filter(x=>ids.includes(x.id));
 const existing=new Set(rewards.map(x=>x.name.trim().toLowerCase()));
 const toAdd=selected.filter(x=>!existing.has(x.name.trim().toLowerCase()));
 if(!toAdd.length)return toast('ของรางวัลที่เลือกมีอยู่ในห้องนี้แล้ว');
 try{for(const r of toAdd){const row={name:r.name,description:r.description||'',emoji:r.emoji||'🎁',cost:r.cost,stock:r.stock??1,active:true};
 if(isDemo()){demo.rewards.push({...row,id:'r'+Date.now()+Math.random(),classroom_id:activeRoom});}
 else{const {error}=await supa.from('reward_items').insert({...row,classroom_id:activeRoom,created_by:user.id});if(error)throw error;}}
 if(isDemo()){saveDemo();rewards=demo.rewards.filter(x=>x.classroom_id===activeRoom)}else await loadRoom();
 closeModal();renderTeacher();toast(`เพิ่มของรางวัล ${toAdd.length} รายการเข้าห้องแล้ว`);
 }catch(e){toast(e.message)}
}
function requestManagement(){return `<section class="panel"><div class="split"><div><h3>🔔 คำขอแลกรางวัล</h3><div class="tiny muted">ครูอนุมัติแล้วระบบจึงหักดาวและตัดสต็อก</div></div><div class="actions"><span class="badge">รออนุมัติ ${requests.filter(r=>r.status==='pending').length} รายการ</span>${requests.some(r=>r.status==='pending')?`<button class="btn green small" onclick="bulkHandleRequests(true)">อนุมัติทั้งหมด</button><button class="btn red small" onclick="bulkHandleRequests(false)">ปฏิเสธทั้งหมด</button>`:''}</div></div>${requests.map(r=>{let s=r.students||students.find(x=>x.id===r.student_id),rw=r.reward_items||rewards.find(x=>x.id===r.reward_id);return `<div class="listrow"><div class="row"><span class="profile-icon">${esc(s?.profile_icon||'⭐')}</span><div><strong>${esc(s?.full_name||'นักเรียน')}</strong><div class="tiny muted">${esc(rw?.emoji||'🎁')} ${esc(rw?.name||'ของรางวัล')} • ${money(r.cost)} ⭐</div><div class="tiny muted">${new Date(r.created_at||Date.now()).toLocaleString('th-TH')}</div></div></div><div class="actions">${r.status==='pending'?`<button class="btn green small" onclick="handleRequest('${r.id}',true)">อนุมัติ</button><button class="btn red small" onclick="handleRequest('${r.id}',false)">ปฏิเสธ</button>`:`<span class="badge">${r.status==='approved'?'อนุมัติแล้ว':'ปฏิเสธแล้ว'}</span>`}</div></div>`}).join('')||'<div class="empty"><div class="big">🎁</div>ยังไม่มีคำขอแลกรางวัล</div>'}</section>`}
function teacherManagement(){return `<div class="grid contentgrid"><section class="panel"><div class="split"><h3>👩‍🏫 ทีมครูประจำห้อง</h3><button class="btn primary" onclick="inviteTeacher()">＋ เชิญครู</button></div>${teachers.map(t=>`<div class="listrow team-member"><div class="row"><span class="profile-icon">${esc(t.profile_icon||'🧑‍🏫')}</span><div><strong>${esc(t.name)}</strong><div class="tiny muted">${t.role==='owner'?'👑 เจ้าของห้อง':'ครูผู้ร่วมดูแล'}${t.teacher_id&&t.teacher_id===user?.id?' • คุณ':''}</div></div></div>${!isDemo()&&roomNow()?.my_role==='owner'&&t.role==='teacher'&&t.teacher_id?`<div class="actions"><button class="btn soft small" onclick="promoteTeacher('${t.teacher_id}')">👑 แต่งตั้งเป็นเจ้าของห้อง</button><button class="btn red small" onclick="removeTeacher('${t.teacher_id}')">ลบออกจากห้อง</button></div>`:''}${!isDemo()&&t.teacher_id===user?.id&&t.role!=='owner'?`<button class="btn red small" onclick="leaveClassroom()">🚪 ออกจากห้อง</button>`:''}</div>`).join('')||'<div class="empty">ยังไม่มีข้อมูลทีมครู</div>'}</section><section class="panel"><h3>🤝 เพิ่มครูร่วมดูแล</h3><p class="muted tiny">เจ้าของห้องสร้างลิงก์เชิญ ครูอีกคนสมัครบัญชีหรือเข้าสู่ระบบเพื่อเข้าร่วม</p><button class="btn soft" onclick="inviteTeacher()">สร้างลิงก์เชิญครู</button></section></div>`}
function openCreateRoom(){modal(`<h3>🏫 สร้างห้องเรียน</h3><div class="fieldrow"><label>ชื่อห้องเรียน</label><input class="field" id="roomName" placeholder="เช่น ป.5/2"></div><div class="modalfoot"><button class="btn white" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="createRoom()">สร้างห้อง</button></div>`)}
async function createRoom(){let name=$('#roomName').value.trim();if(!name)return toast('กรุณาระบุชื่อห้อง');try{if(isDemo()){let id='room-'+Date.now();demo.rooms.push({id,name});demo.activeRoom=id;saveDemo();rooms=demo.rooms;activeRoom=id;students=demo.students.filter(s=>s.classroom_id===id);rewards=demo.rewards.filter(r=>r.classroom_id===id);requests=demo.requests.filter(r=>r.classroom_id===id)}else{let {data,error}=await supa.rpc('create_classroom',{p_name:name});if(error)throw error;await loadTeacher();activeRoom=data;await loadRoom()}closeModal();renderTeacher()}catch(e){toast(e.message)}}
async function inviteTeacher(){if(!activeRoom)return;if(isDemo())return toast('ระบบเชิญครูใช้ได้เมื่อเชื่อมฐานข้อมูลออนไลน์');try{let {data,error}=await supa.rpc('create_classroom_invite',{p_classroom_id:activeRoom});if(error)throw error;let url=location.origin+location.pathname+'?invite='+data;modal(`<h3>🔗 ลิงก์เชิญครู</h3><p class="tiny muted">ส่งลิงก์นี้ให้ครูที่ต้องการร่วมดูแลห้องเรียน ลิงก์หมดอายุใน 7 วัน</p><input class="field" id="inviteUrl" readonly value="${esc(url)}"><div class="modalfoot"><button class="btn white" onclick="closeModal()">ปิด</button><button class="btn primary" onclick="navigator.clipboard.writeText($('#inviteUrl').value).then(()=>toast('คัดลอกลิงก์แล้ว'))">คัดลอกลิงก์</button></div>`)}catch(e){toast(e.message)}}
function openStudentForm(id=null){let s=students.find(x=>x.id===id);window.selectedIcon=s?.profile_icon||'⭐';modal(`<h3>${s?'แก้ไขนักเรียน':'เพิ่มนักเรียน'} 👩‍🎓</h3><div class="fieldrow"><label>ชื่อ-นามสกุล</label><input class="field" id="studentName" value="${esc(s?.full_name||'')}" placeholder="กรอกชื่อ-นามสกุล"></div><div class="fieldrow"><label>ไอคอนประจำตัว</label>${iconPicker(window.selectedIcon)}</div><div class="modalfoot"><button class="btn white" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveStudent('${id||''}')">บันทึก</button></div>`)}
function editStudent(id){openStudentForm(id)}
async function saveStudent(id){let name=$('#studentName').value.trim(),profile_icon=window.selectedIcon||'⭐';if(!name)return toast('กรุณากรอกชื่อนักเรียน');try{if(isDemo()){if(id){let s=students.find(x=>x.id===id);s.full_name=name;s.profile_icon=profile_icon}else{demo.students.push({id:'s'+Date.now(),classroom_id:activeRoom,full_name:name,stars:0,profile_icon,qr_token:'demo-'+Math.random().toString(36).slice(2),active:true})}saveDemo();students=demo.students}else if(id){let {error}=await supa.from('students').update({full_name:name}).eq('id',id);if(error)throw error;let {error:e2}=await supa.rpc('teacher_set_student_icon',{p_student_id:id,p_profile_icon:profile_icon});if(e2)throw e2}else{let {data,error}=await supa.from('students').insert({classroom_id:activeRoom,full_name:name,profile_icon}).select().single();if(error)throw error;students.push(data)}closeModal();if(!isDemo())await loadRoom();renderTeacher()}catch(e){toast(e.message)}}
function openBulkStudents(){modal(`<h3>👥 เพิ่มนักเรียนหลายคน</h3><div class="fieldrow"><label>วางรายชื่อ (1 บรรทัดต่อ 1 คน)</label><textarea class="field" id="bulkNames" rows="9" placeholder="เด็กชายสมชาย ใจดี&#10;เด็กหญิงสมหญิง รักเรียน&#10;เด็กชายมานะ ขยันเรียน"></textarea><div class="tiny muted">คัดลอกรายชื่อจาก Excel หรือ Google Sheets แล้ววางได้ ระบบข้ามชื่อซ้ำในห้องนี้</div></div><div class="modalfoot"><button class="btn white" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveBulkStudents()">เพิ่มรายชื่อ</button></div>`)}
async function saveBulkStudents(){let names=$('#bulkNames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!names.length)return toast('กรุณาวางรายชื่อก่อน');let existing=currentStudents().map(s=>s.full_name.toLowerCase()),newNames=[...new Set(names.filter(n=>!existing.includes(n.toLowerCase())))];if(!newNames.length)return toast('ไม่พบรายชื่อใหม่');try{if(isDemo()){newNames.forEach(name=>demo.students.push({id:'s'+Date.now()+Math.random(),classroom_id:activeRoom,full_name:name,stars:0,profile_icon:'⭐',qr_token:'demo-'+Math.random().toString(36).slice(2),active:true}));saveDemo();students=demo.students}else{let {error}=await supa.from('students').insert(newNames.map(full_name=>({classroom_id:activeRoom,full_name})));if(error)throw error;await loadRoom()}closeModal();renderTeacher();toast(`เพิ่มนักเรียน ${newNames.length} คนเรียบร้อย`)}catch(e){toast(e.message)}}
function openScore(id=''){let s=currentStudents().find(x=>x.id===id);modal(`<h3>⭐ เพิ่ม / หักดาว</h3><div class="fieldrow"><label>นักเรียน</label><select class="field" id="scoreStudent">${currentStudents().map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.full_name)} • ${money(x.stars)} ⭐</option>`).join('')}</select></div><div class="fieldrow"><label>รายการ</label><select class="field" id="scoreSign"><option value="1">เพิ่มดาว (+)</option><option value="-1">หักดาว (−)</option></select></div><div class="fieldrow"><label>จำนวนดาว</label><input class="field" id="scoreAmount" type="number" min="1" value="10"></div><div class="fieldrow"><label>เหตุผล</label><input class="field" id="scoreReason" placeholder="เช่น ส่งงานตรงเวลา ช่วยเหลือเพื่อน"></div><div class="modalfoot"><button class="btn white" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveScore()">บันทึกดาว</button></div>`)}
async function saveScore(){let id=$('#scoreStudent').value,delta=Number($('#scoreAmount').value)*Number($('#scoreSign').value),reason=$('#scoreReason').value.trim();if(!delta||!reason)return toast('กรุณากรอกจำนวนดาวและเหตุผล');let s=students.find(x=>x.id===id);if(!s)return toast('ไม่พบนักเรียน');try{if(isDemo()){s.stars+=delta;demo.transactions.unshift({student_id:id,stars_delta:delta,reason,created_at:new Date().toISOString()});saveDemo()}else{let {error}=await supa.rpc('teacher_adjust_stars',{p_student_id:id,p_stars_delta:delta,p_reason:reason});if(error)throw error;await loadRoom()}closeModal();renderTeacher();toast('บันทึกดาวเรียบร้อย')}catch(e){toast(e.message)}}

async function deleteRoomReward(id){const r=rewards.find(x=>x.id===id);if(!r)return;if(!confirm(`ยืนยันลบของรางวัล “${r.name}” ออกจากห้องนี้?`))return;try{if(isDemo()){demo.rewards=demo.rewards.filter(x=>x.id!==id);rewards=demo.rewards.filter(x=>x.classroom_id===activeRoom);saveDemo()}else{const {error}=await supa.from('reward_items').delete().eq('id',id).eq('classroom_id',activeRoom);if(error)throw error;await loadRoom()}renderTeacher();toast('ลบของรางวัลแล้ว')}catch(e){toast(e.message)}}
async function deleteAllRoomRewards(){if(!rewards.length)return toast('ไม่มีของรางวัลให้ลบ');if(!confirm(`ยืนยันลบของรางวัลทั้งหมด ${rewards.length} รายการในห้องนี้? รายการในคลังส่วนตัวจะไม่ถูกลบ`))return;try{if(isDemo()){const ids=new Set(rewards.map(x=>x.id));demo.rewards=demo.rewards.filter(x=>!ids.has(x.id));rewards=[];saveDemo()}else{const {error}=await supa.from('reward_items').delete().eq('classroom_id',activeRoom);if(error)throw error;await loadRoom()}renderTeacher();toast('ลบของรางวัลในห้องนี้ทั้งหมดแล้ว')}catch(e){toast(e.message)}}
function openRewardForm(id=null){let r=rewards.find(x=>x.id===id);modal(`<h3>${r?'แก้ไขของรางวัล':'เพิ่มของรางวัล'} 🎁</h3><div class="fieldrow"><label>ชื่อของรางวัล</label><input class="field" id="rewardName" value="${esc(r?.name||'')}" placeholder="เช่น ชุดเครื่องเขียน"></div><div class="fieldrow"><label>รายละเอียด</label><input class="field" id="rewardDesc" value="${esc(r?.description||'')}" placeholder="รายละเอียดของรางวัล"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="fieldrow"><label>ไอคอน</label><input class="field" id="rewardEmoji" value="${esc(r?.emoji||'🎁')}" maxlength="5"></div><div class="fieldrow"><label>ราคา (ดาว)</label><input class="field" id="rewardCost" type="number" min="1" value="${r?.cost||50}"></div></div><div class="fieldrow"><label>จำนวนคงเหลือ</label><input class="field" id="rewardStock" type="number" min="0" value="${r?.stock??5}"></div><div class="modalfoot"><button class="btn white" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveReward('${id||''}')">บันทึก</button></div>`)}

async function saveReward(id){let row={name:$('#rewardName').value.trim(),description:$('#rewardDesc').value.trim(),emoji:$('#rewardEmoji').value.trim()||'🎁',cost:Number($('#rewardCost').value),stock:Number($('#rewardStock').value),active:true};if(!row.name||row.cost<1||row.stock<0)return toast('กรุณาตรวจสอบข้อมูลของรางวัล');try{if(isDemo()){if(id)Object.assign(rewards.find(x=>x.id===id),row);else{row.id='r'+Date.now();row.classroom_id=activeRoom;demo.rewards.push(row)}saveDemo();rewards=demo.rewards}else{let q=id?supa.from('reward_items').update(row).eq('id',id):supa.from('reward_items').insert({...row,classroom_id:activeRoom,created_by:user.id});let {error}=await q;if(error)throw error;await loadRoom()}closeModal();renderTeacher()}catch(e){toast(e.message)}}
function requestManagement(){return `<section class="panel"><div class="split"><div><h3>🔔 คำขอแลกรางวัล</h3><div class="tiny muted">ครูอนุมัติแล้วระบบจึงหักดาวและตัดสต็อก</div></div><div class="actions"><span class="badge">รออนุมัติ ${requests.filter(r=>r.status==='pending').length} รายการ</span>${requests.some(r=>r.status==='pending')?`<button class="btn green small" onclick="bulkHandleRequests(true)">อนุมัติทั้งหมด</button><button class="btn red small" onclick="bulkHandleRequests(false)">ปฏิเสธทั้งหมด</button>`:''}</div></div>${requests.map(r=>{let s=r.students||students.find(x=>x.id===r.student_id),rw=r.reward_items||rewards.find(x=>x.id===r.reward_id);return `<div class="listrow"><div class="row"><span class="profile-icon">${esc(s?.profile_icon||'⭐')}</span><div><strong>${esc(s?.full_name||'นักเรียน')}</strong><div class="tiny muted">${esc(rw?.emoji||'🎁')} ${esc(rw?.name||'ของรางวัล')} • ${money(r.cost)} ⭐</div><div class="tiny muted">${new Date(r.created_at||Date.now()).toLocaleString('th-TH')}</div></div></div><div class="actions">${r.status==='pending'?`<button class="btn green small" onclick="handleRequest('${r.id}',true)">อนุมัติ</button><button class="btn red small" onclick="handleRequest('${r.id}',false)">ปฏิเสธ</button>`:`<span class="badge">${r.status==='approved'?'อนุมัติแล้ว':'ปฏิเสธแล้ว'}</span>`}</div></div>`}).join('')||'<div class="empty"><div class="big">🎁</div>ยังไม่มีคำขอแลกรางวัล</div>'}</section>`}
async function bulkHandleRequests(approve){let ids=requests.filter(r=>r.status==='pending').map(r=>r.id);if(!ids.length)return toast('ไม่มีคำขอที่รอดำเนินการ');askConfirmButtons(`ยืนยัน${approve?'อนุมัติ':'ปฏิเสธ'}คำขอแลกรางวัลทั้งหมด ${ids.length} รายการหรือไม่?${approve?' ระบบจะหักดาวและตัดสต็อกตามคำขอที่อนุมัติ':''}`,'ยืนยัน',async()=>{let done=0;try{for(const id of ids){let {error}=await supa.rpc('teacher_handle_redemption',{p_request_id:id,p_approve:approve,p_note:''});if(error)throw error;done++}await loadRoom();renderTeacher();toast(`${approve?'อนุมัติ':'ปฏิเสธ'}สำเร็จ ${done} รายการ`)}catch(e){await loadRoom();renderTeacher();toast(`ดำเนินการสำเร็จ ${done}/${ids.length} รายการ: ${friendlyErr(e)}`)}})}
async function handleRequest(id,approve){let note=prompt(approve?'หมายเหตุถึงนักเรียน (ไม่บังคับ)':'เหตุผลที่ปฏิเสธ (ไม่บังคับ)','')||'';try{if(isDemo()){let r=requests.find(x=>x.id===id);if(!r||r.status!=='pending')throw new Error('คำขอนี้ถูกจัดการแล้ว');if(approve){let s=students.find(x=>x.id===r.student_id),rw=rewards.find(x=>x.id===r.reward_id);if(!s||s.stars<r.cost||rw.stock<1)throw new Error('ดาวหรือสต็อกไม่เพียงพอ');s.stars-=r.cost;rw.stock--;demo.transactions.unshift({student_id:s.id,stars_delta:-r.cost,reason:'แลกรางวัล: '+rw.name,created_at:new Date().toISOString()})}r.status=approve?'approved':'rejected';r.teacher_note=note;saveDemo()}else{let {error}=await supa.rpc('teacher_handle_redemption',{p_request_id:id,p_approve:approve,p_note:note});if(error)throw error;await loadRoom()}renderTeacher();toast(approve?'อนุมัติและหักดาวแล้ว':'ปฏิเสธคำขอแล้ว')}catch(e){toast(e.message)}}

let urgentRealtimeChannel=null,urgentPollTimer=null,urgentAlertTimer=null,urgentAlertEnds=0,seenUrgentMissionIds=new Set();
function playUrgentSound(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),now=c.currentTime;[880,660,880].forEach((hz,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,now+i*.18);g.gain.exponentialRampToValueAtTime(.18,now+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.18+.14);o.connect(g);g.connect(c.destination);o.start(now+i*.18);o.stop(now+i*.18+.15)});setTimeout(()=>c.close(),900)}catch(e){}}
function showUrgentMissionAlert(m){if(!m||!m.id||seenUrgentMissionIds.has(m.id))return;seenUrgentMissionIds.add(m.id);let seconds=Math.max(5,Math.min(30,Number(m.alert_seconds)||10));document.getElementById('urgentAlertModal')?.remove();let box=document.createElement('div');box.id='urgentAlertModal';box.innerHTML=`<div class="urgent-pop"><div class="urgent-big">🚨⭐</div><span class="badge urgent-badge">ภารกิจด่วนเข้ามาใหม่</span><h2>${esc(m.title||'ภารกิจด่วน')}</h2><p>${esc(m.description||'คุณครูส่งภารกิจด่วนมาให้แล้ว')}</p><div class="urgent-count" id="urgentAlertCount">${seconds}</div><div class="tiny muted">หน้าต่างนี้จะปิดเองเมื่อหมดเวลา</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="openUrgentMissionFromAlert('${m.id}')">ไปที่ภารกิจเลย 🚀</button><button class="btn white small" style="margin-top:8px" onclick="closeUrgentMissionAlert()">ปิด</button></div>`;document.body.append(box);playUrgentSound();urgentAlertEnds=Date.now()+seconds*1000;clearInterval(urgentAlertTimer);urgentAlertTimer=setInterval(()=>{let left=Math.max(0,Math.ceil((urgentAlertEnds-Date.now())/1000)),el=document.getElementById('urgentAlertCount');if(el)el.textContent=left;if(!left)closeUrgentMissionAlert()},250)}
function closeUrgentMissionAlert(){clearInterval(urgentAlertTimer);urgentAlertTimer=null;document.getElementById('urgentAlertModal')?.remove()}
async function openUrgentMissionFromAlert(id){closeUrgentMissionAlert();try{studentData=await getStudentPortal(studentToken);studentTab='missions';renderStudent();setTimeout(()=>document.querySelector(`[data-mission-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),100)}catch(e){toast('เปิดภารกิจไม่สำเร็จ: '+e.message)}}
function subscribeUrgentMissions(){if(!studentToken||!studentData)return;if(urgentPollTimer)clearInterval(urgentPollTimer);if(!seenUrgentMissionIds.size)(studentData.missions||[]).forEach(m=>seenUrgentMissionIds.add(m.id));urgentPollTimer=setInterval(async()=>{try{let fresh=await getStudentPortal(studentToken);if(!fresh)return;studentData=fresh;(fresh.missions||[]).forEach(m=>{if(m.is_urgent&&!seenUrgentMissionIds.has(m.id)&&(!m.urgent_until||new Date(m.urgent_until)>new Date()))showUrgentMissionAlert(m);else seenUrgentMissionIds.add(m.id)})}catch(e){}},5000)}

function addMissionEvidence(files,replaceIndex=-1){
  let incoming=[...(files||[])].filter(f=>f&&f.type&&f.type.startsWith('image/'));
  if(!incoming.length){toast('กรุณาเลือกไฟล์ภาพ JPG, PNG หรือ WebP');return}
  if(replaceIndex>=0){
    selectedMissionEvidence[replaceIndex]=incoming[0];
    if(incoming.length>1)toast('แก้ไขภาพได้ครั้งละ 1 ภาพ');
  }else{
    let room=4-selectedMissionEvidence.length;
    if(incoming.length>room)toast('แนบได้สูงสุด 4 ภาพ ระบบเพิ่มเฉพาะจำนวนที่ยังว่าง');
    selectedMissionEvidence.push(...incoming.slice(0,room));
  }
  renderMissionFileList();
}

function imageToJpeg(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);let quality=.78;const encode=()=>canvas.toBlob(blob=>{if(!blob){URL.revokeObjectURL(url);return reject(new Error('แปลงรูปภาพไม่สำเร็จ'))}if(blob.size>1400*1024&&quality>.52){quality-=.1;return encode()}URL.revokeObjectURL(url);resolve(new File([blob],(file.name.replace(/\.[^.]+$/,'')||'mission')+'.jpg',{type:'image/jpeg',lastModified:Date.now()}))},'image/jpeg',quality);encode()}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('เปิดรูปภาพนี้ไม่ได้ กรุณาใช้ JPG, PNG หรือ WebP'))};img.src=url})}
function missionProgress(title,detail,done=0,total=0){let pct=total?Math.round(done/total*100):0;modal(`<div class="center"><div class="progress-orbit"><span>🌟</span></div><h3>${title}</h3><p class="muted" id="missionProgressDetail">${detail}</p><div style="height:9px;background:#eee9ff;border-radius:99px;overflow:hidden;margin:15px 0"><div id="missionProgressBar" style="height:100%;width:${pct}%;background:linear-gradient(90deg,#7668e8,#ff8d9d);border-radius:99px;transition:width .25s"></div></div><div class="tiny muted" id="missionProgressCount">${total?`${done}/${total} ภาพ`:'กำลังเตรียมภาพ'}</div><div class="notice info">อย่าปิดหน้านี้นะ อีกนิดเดียวก็เสร็จแล้ว 💜</div></div>`)}

var missionNoteDraft='';
async function submitMission(id){
  if(missionUploadBusy)return;
  let previous=(studentData?.mission_submissions||[]).filter(x=>x.mission_id===id);
  if(previous.some(x=>x.status==='pending'))return toast('ส่งภารกิจนี้แล้ว กรุณารอคุณครูอนุมัติก่อน');
  if(previous.some(x=>x.status==='approved'))return toast('ภารกิจนี้ได้รับอนุมัติแล้ว ไม่สามารถส่งซ้ำได้');
  let files=selectedMissionFiles();
  if(!files.length)return toast('กรุณาถ่ายภาพหรือเลือกภาพหลักฐาน');
  if(files.length>4)return toast('แนบภาพได้สูงสุด 4 ภาพ');
  if(!supa||!studentToken)return toast('การเชื่อมต่อยังไม่พร้อม กรุณาออกจากระบบแล้วสแกน QR ใหม่');
  let note=($('#missionNote')?.value||'').trim().slice(0,500);missionNoteDraft=note;
  missionUploadBusy=true;let uploaded=[];
  try{
    missionProgress('กำลังเตรียมหลักฐาน','กำลังปรับขนาดภาพให้ส่งได้เร็วขึ้น…',0,files.length);
    let optimized=[];
    for(let i=0;i<files.length;i++){optimized.push(await imageToJpeg(files[i]));updateMissionProgress(`เตรียมภาพแล้ว ${i+1}/${files.length}`,i+1,files.length)}
    let done=0;
    missionProgress('กำลังส่งภาพขึ้นระบบ','กำลังอัปโหลดภาพอย่างปลอดภัย…',0,files.length);
    let settled=await Promise.allSettled(optimized.map(async(f)=>{
      let path=`${studentToken}/${crypto.randomUUID()}.jpg`;
      let up=await supa.storage.from('mission-evidence').upload(path,f,{contentType:'image/jpeg',upsert:false,cacheControl:'3600'});
      if(up.error)throw up.error;
      uploaded.push(path);done++;updateMissionProgress(`ส่งภาพแล้ว ${done}/${files.length} ภาพ`,done,files.length);return path
    }));
    let failed=settled.find(x=>x.status==='rejected');if(failed)throw failed.reason;
    let results=settled.map(x=>x.value);
    missionProgress('กำลังบันทึกการส่ง','ภาพครบแล้ว กำลังส่งภารกิจให้คุณครู…',files.length,files.length);
    let {error}=await supa.rpc('student_submit_mission',{p_token:studentToken,p_mission_id:id,p_image_path:results.join('|'),p_note:note});
    if(error)throw error;
    missionUploadBusy=false;selectedMissionEvidence=[];missionNoteDraft='';
    missionPreviewUrls.forEach(u=>URL.revokeObjectURL(u));missionPreviewUrls=[];
    modal(`<div class="center"><div class="success-pop">✓</div><h2 style="color:#25855c">ส่งภาพสำเร็จแล้ว!</h2><p>หลักฐาน ${files.length} ภาพถูกส่งให้คุณครูเรียบร้อย 🎉</p><div class="notice success">ตอนนี้สถานะเป็น <b>รอคุณครูตรวจ</b> เมื่อครูอนุมัติ คุณจะได้รับดาวตามภารกิจ</div><div class="modalfoot" style="justify-content:center"><button class="btn primary" onclick="closeModal();loadStudent().then(()=>{studentTab='missions';renderStudent()})">เรียบร้อย</button></div></div>`);
  }catch(e){
    if(uploaded.length)await supa.storage.from('mission-evidence').remove(uploaded);
    missionUploadBusy=false;
    modal(`<div class="center"><div style="font-size:42px">💜</div><h3>ยังส่งภาพไม่สำเร็จ</h3><p>${esc(friendlyErr(e))}</p><p class="tiny muted">ภาพที่เลือกไว้ยังอยู่ สามารถแก้ไขภาพหรือกดส่งอีกครั้งได้</p><div class="modalfoot" style="justify-content:center"><button class="btn white" onclick="closeModal();openMissionSubmit('${id}',true)">กลับไปแก้ไข</button><button class="btn primary" onclick="openMissionSubmit('${id}',true);submitMission('${id}')">ลองส่งอีกครั้ง</button></div></div>`);
  }

function missionManagement(){let pending=missionSubmissions.filter(x=>x.status==='pending');let today=new Date(),defaultDay=localDateKey(today),selectedDay=window.missionHistoryDay||defaultDay;let minDay=localDateKey(new Date(today.getFullYear(),today.getMonth(),today.getDate()-6));let history=missionSubmissions.filter(q=>localDateKey(new Date(q.created_at))===selectedDay);let total=currentStudents().length;let managed=missions.map(m=>{let latest=new Map();missionSubmissions.filter(q=>q.mission_id===m.id).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(q=>latest.set(q.student_id,q));let states=[...latest.values()],approved=states.filter(q=>q.status==='approved').length,waiting=states.filter(q=>q.status==='pending').length,fix=states.filter(q=>q.status==='rejected').length,notSent=Math.max(0,total-states.length),pct=total?Math.round(approved/total*100):0,expired=missionIsExpired(m,today),completed=total>0&&approved>=total;return {m,approved,waiting,fix,notSent,pct,expired,completed}});let visible=managed.filter(x=>x.m.active!==false&&!x.expired&&!x.completed);let grouped=visible.filter(x=>!missionDeadline(x.m)).length;let renderMission=x=>{let m=x.m,deadline=missionDeadline(m);return `<article class="listrow mission-manage-card" style="display:block;margin:12px 0;padding:15px;border:1px solid #eee8f5;border-radius:17px;background:linear-gradient(145deg,#fff,#fcfaff)"><div class="split" style="align-items:flex-start;gap:8px"><div style="min-width:0"><strong style="font-size:17px">${esc(m.title)}</strong><div class="tiny muted" style="margin-top:4px">${esc(m.category||'ภารกิจทั่วไป')} · +${m.reward_stars} ⭐</div></div><span class="badge" style="white-space:nowrap">${deadline?'มีเวลาสิ้นสุด':'ไม่จำกัดเวลา'}</span></div>${m.description?`<p class="tiny muted" style="margin:8px 0">${esc(m.description)}</p>`:''}<div class="mission-status-heading" style="font-weight:800;margin:12px 0 7px;color:#51466e">📊 สถานะภารกิจ</div><div style="height:9px;back async function reviewMission(id,action){let approve=action==='approve',revise=action==='revise';let title=approve?'หมายเหตุถึงนักเรียน (ไม่บังคับ)':revise?'เหตุผลที่ส่งกลับให้แก้ไข (จำเป็น)':'เหตุผลที่ไม่อนุมัติ';let note=prompt(title,revise?'กรุณาปรับปรุงผลงานแล้วส่งใหม่':'') ;if(note===null)return;note=note.trim();if(revise&&!note)return toast('กรุณาระบุสิ่งที่ต้องแก้ไขก่อนส่งกลับ');try{let rpc=revise?'teacher_return_mission':'teacher_review_mission';let args=revise?{p_submission_id:id,p_note:note}:{p_submission_id:id,p_approve:approve,p_note:note};let {error}=await supa.rpc(rpc,args);if(error)throw error;await loadRoom();renderTeacher();toast(approve?'อนุมัติแล้ว เพิ่มดาวให้นักเรียนเรียบร้อย':revise?'ส่งกลับให้นักเรียนแก้ไขแล้ว':'บันทึกผลไม่อนุมัติแล้ว')}catch(e){toast(friendlyErr(e))}}

  const border={top:{style:'thin',color:{argb:LINE}},left:{style:'thin',color:{argb:LINE}},bottom:{style:'thin',color:{argb:LINE}},right:{style:'thin',color:{argb:LINE}}};
  const exportedAt=new Date().toLocaleString('th-TH',{dateStyle:'long',timeStyle:'short'});
  function makeSheet(name,title,headers,widths){
    const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:4,showGridLines:false}],pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0}});
    const n=headers.length,last=String.fromCharCode(64+n);
    widths.forEach((w,i)=>ws.getColumn(i+1).width=w);
    ws.mergeCells(`A1:${last}1`);let c1=ws.getCell('A1');c1.value=title;c1.font={name:XL_FONT,size:26,bold:true,color:{argb:PURPLE}};c1.alignment={vertical:'middle',horizontal:'left'};ws.getRow(1).height=40;
    ws.mergeCells(`A2:${last}2`);let c2=ws.getCell('A2');c2.value=`ห้องเรียน: ${room}   •   ส่งออกเมื่อ ${exportedAt}`;c2.font={name:XL_FONT,size:16,color:{argb:'FF7A7391'}};c2.alignment={vertical:'middle',horizontal:'left'};ws.getRow(2).height=26;
    ws.getRow(3).height=8;
    const hr=ws.getRow(4);hr.height=34;
    headers.forEach((h,i)=>{let c=hr.getCell(i+1);c.value=h;c.font={name:XL_FONT,size:17,bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PURPLE}};c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border=border});
    ws.autoFilter=`A4:${last}4`;
    return ws;
  }
  function putRow(ws,r,vals,aligns,zebra){
    const row=ws.getRow(r);row.height=26;
    vals.forEach((v,i)=>{let c=row.getCell(i+1);c.value=v;c.font={name:XL_FONT,size:16,color:{argb:INK}};c.alignment={vertical:'middle',horizontal:aligns[i]||'left',wrapText:true};c.border=border;if(zebra)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}}});
    return row;
  }
  function emptyRow(ws,r,n,msg){ws.mergeCells(`A${r}:${String.fromCharCode(64+n)}${r}`);let c=ws.getCell(`A${r}`);c.value=msg;c.font={name:XL_FONT,size:16,italic:true,color:{argb:'FF7A7391'}};c.alignment={horizontal:'center',vertical:'middle'};ws.getRow(r).height=30}

  /* --- ชีต 1: สรุปนักเรียน --- */
  const stat={};ss.forEach(s=>stat[s.id]={gain:0,loss:0,rCount:0,rStars:0,last:null});
  tx.forEach(t=>{let a=stat[t.student_id];if(!a)return;let d=Number(t.stars_delta)||0;if(isRedeemTx(t)){a.rCount++;a.rStars+=Math.abs(d)}else if(d>=0)a.gain+=d;else a.loss+=-d;if(!a.last||new Date(t.created_at)>new Date(a.last))a.last=t.created_at});
  const h1=['ลำดับ','ชื่อ-นามสกุล','ดาวคงเหลือ','ดาวที่ได้รับรวม','ดาวที่ถูกหักรวม','แลกรางวัล (ครั้ง)','ดาวที่ใช้แลก','กิจกรรมล่าสุด'];
  const ws1=makeSheet('สรุปนักเรียน','STAR UP! • สรุปดาวนักเรียน',h1,[9,36,15,17,17,17,16,22]);
  let r=5;
  ss.forEach((s,i)=>{let a=stat[s.id],row=putRow(ws1,r,[i+1,s.full_name,Number(s.stars)||0,a.gain,a.loss,a.rCount,a.rStars,a.last?xlDate(a.last):'-'],['center','left','center','center','center','center','center','center'],i%2===1);
    let bal=row.getCell(3);bal.font={name:XL_FONT,size:17,bold:true,color:{argb:(Number(s.stars)||0)<0?'FFB3402F':'FF1E7A4F'}};bal.numFmt='#,##0;-#,##0;0';r++});
  if(!ss.length){emptyRow(ws1,r,h1.length,'ยังไม่มีรายชื่อนักเรียน');r++}
  else{let tot=ws1.getRow(r);tot.height=30;let sum=f=>ss.reduce((n,s)=>n+f(s),0);
    ['','รวมทั้งห้อง',sum(s=>Number(s.stars)||0),sum(s=>stat[s.id].gain),sum(s=>stat[s.id].loss),sum(s=>stat[s.id].rCount),sum(s=>stat[s.id].rStars),''].forEach((x,i)=>{let c=tot.getCell(i+1);c.value=x;c.font={name:XL_FONT,size:17,bold:true,color:{argb:INK}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF3C4'}};c.alignment={vertical:'middle',horizontal:i===1?'left':'center'};c.border=border;if(i>=2&&i<=6)c.numFmt='#,##0;-#,##0;0'});r++}

  /* --- ชีต 2: ประวัติดาว --- */
  const h2=['ลำดับ','วันที่','เวลา','ชื่อ-นามสกุล','ประเภท','จำนวนดาว','รายละเอียด / เหตุผล'];
  const ws2=makeSheet('ประวัติดาว','STAR UP! • ประวัติการได้รับ / ถูกหักดาว / แลกรางวัล',h2,[9,19,13,32,19,15,52]);
  const TY={gain:{label:'ได้รับดาว',fill:'FFDFF5E8',ink:'FF1E7A4F'},loss:{label:'ถูกหักดาว',fill:'FFFDE4E1',ink:'FFB3402F'},redeem:{label:'แลกของรางวัล',fill:'FFFFF0CC',ink:'FF9A6A00'}};
  const txs=tx.filter(t=>nameOf[t.student_id]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  r=5;
  txs.forEach((t,i)=>{let d=Number(t.stars_delta)||0,k=isRedeemTx(t)?'redeem':d>=0?'gain':'loss',ty=TY[k],detail=k==='redeem'?(String(t.reason).replace(/^แลกรางวัล:?\s*/,'')||'แลกรางวัล'):(t.reason||'-');
    let row=putRow(ws2,r,[i+1,xlDate(t.created_at),xlTime(t.created_at),nameOf[t.student_id],ty.label,d,detail],['center','center','center','left','center','center','left'],i%2===1);
    let c5=row.getCell(5);c5.fill={type:'pattern',pattern:'solid',fgColor:{argb:ty.fill}};c5.font={name:XL_FONT,size:16,bold:true,color:{argb:ty.ink}};
    let c6=row.getCell(6);c6.font={name:XL_FONT,size:17,bold:true,color:{argb:ty.ink}};c6.numFmt='+#,##0;-#,##0;0';r++});
  if(!txs.length)emptyRow(ws2,r,h2.length,'ยังไม่มีประวัติดาว');

  /* --- ชีต 3: การแลกรางวัล --- */
  const h3=['ลำดับ','วันที่ขอ','เวลา','ชื่อ-นามสกุล','ของรางวัล','ดาวที่ใช้','สถานะ','วันที่ดำเนินการ','เวลา','หมายเหตุครู'];
  const ws3=makeSheet('การแลกรางวัล','STAR UP! • คำขอแลกของรางวัล',h3,[9,19,13,32,34,13,17,19,13,34]);
  const ST={pending:{label:'รออนุมัติ',fill:'FFFFF0CC',ink:'FF9A6A00'},approved:{label:'อนุมัติแล้ว',fill:'FFDFF5E8',ink:'FF1E7A4F'},rejected:{label:'ปฏิเสธ',fill:'FFFDE4E1',ink:'FFB3402F'}};
  const rqs=rq.filter(q=>nameOf[q.student_id]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  r=5;
  rqs.forEach((q,i)=>{let st=ST[q.status]||ST.pending,done=q.handled_at||null;
    let row=putRow(ws3,r,[i+1,xlDate(q.created_at),xlTime(q.created_at),nameOf[q.student_id],rwName[q.reward_id]||'ของรางวัล (ถูกลบแล้ว)',Number(q.cost)||0,st.label,done?xlDate(done):'-',done?xlTime(done):'-',q.teacher_note||''],['center','center','center','left','left','center','center','center','center','left'],i%2===1);
    let c7=row.getCell(7);c7.fill={type:'pattern',pattern:'solid',fgColor:{argb:st.fill}};c7.font={name:XL_FONT,size:16,bold:true,color:{argb:st.ink}};r++});
  if(!rqs.length)emptyRow(ws3,r,h3.length,'ยังไม่มีคำขอแลกรางวัล');
  return wb;
}

async function exportExcel(){
  if(!activeRoom)return toast('กรุณาเลือกห้องเรียนก่อน');
  let room=roomNow()?.name||'ห้องเรียน',ss=currentStudents();
  if(!ss.length)return toast('ยังไม่มีนักเรียนในห้องนี้');
  toast('กำลังสร้างไฟล์ Excel...');
  try{
    await loadExcelLib();
    let tx,rq,ids=new Set(ss.map(s=>s.id));
    if(isDemo()){tx=demo.transactions.filter(t=>ids.has(t.student_id));rq=demo.requests.filter(q=>q.classroom_id===activeRoom)}
    else{
      tx=await fetchAllRows((a,b)=>supa.from('star_transactions').select('student_id,stars_delta,reason,created_at').eq('classroom_id',activeRoom).order('created_at',{ascending:false}).order('id').range(a,b));
      rq=await fetchAllRows((a,b)=>supa.from('redemption_requests').select('id,student_id,reward_id,cost,status,teacher_note,created_at,handled_at').eq('classroom_id',activeRoom).order('created_at',{ascending:false}).order('id').range(a,b));
    }
    let wb=buildStarWorkbook(window.ExcelJS,{room,students:ss,tx,rq,rewards});
    let buf=await wb.xlsx.writeBuffer(),d=new Date(),p=n=>String(n).padStart(2,'0'),stamp=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,fname=`STARUP_${room.replace(/[\\/:*?"<>|]/g,'_')}_${stamp}.xlsx`;
    let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fname;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('ส่งออกไฟล์ Excel เรียบร้อย');
  }catch(e){toast(friendlyErr(e))}
}

/* กันกดปุ่มซ้ำ: ขณะที่ปุ่มบันทึก/ยืนยันกำลังทำงานอยู่ จะไม่รับคำสั่งซ้ำ */
function guardOnce(names){names.forEach(n=>{let f=window[n];if(typeof f!=='function')return;window[n]=function(...a){if(_busy&&Date.now()-_busyAt<20000)return;_busy=true;_busyAt=Date.now();let off=()=>{_busy=false;$$('#modal button').forEach(b=>b.disabled=false)};$$('#modal button').forEach(b=>b.disabled=true);let r;try{r=f.apply(this,a)}catch(e){off();throw e}if(r&&typeof r.then==='function')return r.finally(off);off();return r}})}
guardOnce(['saveStudent','saveBulkStudents','saveScore','saveReward','createRoom','saveRoomName','doDeleteRoom','doDelete','handleRequest','saveTeacherProfile','requestReward2','saveStudentIcon','regenQR2','exportExcel']);


/* ===== ให้ / หักดาวหลายคนพร้อมกัน ===== */
function openBulkScore(){let ss=currentStudents();if(!ss.length)return toast('ยังไม่มีนักเรียนในห้องนี้');modal(`<h3>⭐ ให้ / หักดาวหลายคน</h3><div class="fieldrow"><label>เลือกนักเรียน (<b id="bsCount">${ss.length}</b>/${ss.length} คน)</label><div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button type="button" class="btn soft small" onclick="bulkPick(true)">เลือกทั้งห้อง</button><button type="button" class="btn white small" onclick="bulkPick(false)">ล้างที่เลือก</button></div><div style="max-height:230px;overflow:auto;border:1px solid #e8e2f0;border-radius:12px;padding:4px">${ss.map(s=>`<label style="display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;margin:0;color:var(--ink);font-size:14px"><input type="checkbox" class="bsChk" value="${s.id}" checked onchange="bulkCount()" style="width:18px;height:18px;flex:none"><span style="flex:1">${esc(s.full_name)}</span><span class="tiny muted">${money(s.stars)} ⭐</span></label>`).join('')}</div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="fieldrow"><label>รายการ</label><select class="field" id="bsSign"><option value="1">เพิ่มดาว (+)</option><option value="-1">หักดาว (−)</option></select></div><div class="fieldrow"><label>จำนวนดาวต่อคน</label><input class="field" id="bsAmount" type="number" min="1" step="1" value="5"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 4px">${[1,2,5,10,20].map(n=>`<button type="button" class="btn soft small" onclick="$('#bsAmount').value=${n}">${n}</button>`).join('')}</div><div class="fieldrow"><label>เหตุผล</label><input class="field" id="bsReason" placeholder="เช่น ทำความสะอาดห้อง ตั้งใจเรียนทั้งห้อง"></div><div class="modalfoot"><button class="btn white" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveBulkScore()">บันทึกดาว</button></div>`)}
function bulkPick(on){$$('.bsChk').forEach(c=>c.checked=on);bulkCount()}
function bulkCount(){let n=$$('.bsChk').filter(c=>c.checked).length,e=$('#bsCount');if(e)e.textContent=n}
async function saveBulkScore(){let ids=$$('.bsChk').filter(c=>c.checked).map(c=>c.value),delta=Number($('#bsAmount').value)*Number($('#bsSign').value),reason=$('#bsReason').value.trim();
  if(!ids.length)return toast('กรุณาเลือกนักเรียนอย่างน้อย 1 คน');
  if(!Number.isInteger(delta)||!delta||Math.abs(delta)>100000||!reason)return toast('กรุณากรอกจำนวนดาว (จำนวนเต็ม) และเหตุผล');
  try{
    if(isDemo()){ids.forEach(id=>{let s=students.find(x=>x.id===id);if(!s)return;s.stars=(Number(s.stars)||0)+delta;demo.transactions.unshift({student_id:id,stars_delta:delta,reason,created_at:new Date().toISOString()})});saveDemo()}
    else{
      let {error}=await supa.rpc('teacher_adjust_stars_bulk',{p_student_ids:ids,p_stars_delta:delta,p_reason:reason});
      if(error&&(error.code==='PGRST202'||/Could not find the function/i.test(error.message||''))){for(let id of ids){let r=await supa.rpc('teacher_adjust_stars',{p_student_id:id,p_stars_delta:delta,p_reason:reason});if(r.error)throw r.error}}
      else if(error)throw error;
      await loadRoom()}
    closeModal();renderTeacher();toast(`${delta>0?'เพิ่ม':'หัก'}ดาวให้นักเรียน ${ids.length} คนเรียบร้อย`)
  }catch(e){if(!isDemo()){try{await loadRoom();renderTeacher()}catch(_){}}toast(friendlyErr(e))}
}
guardOnce(['saveBulkScore']);


/* ===== ทีมครู: แต่งตั้งเจ้าของห้อง / ลบครูออก / ตรวจว่าถูกนำออกจากห้องหรือไม่ ===== */
function leaveClassroom(){if(!activeRoom||roomNow()?.my_role==='owner')return toast('เจ้าของห้องต้องโอนสิทธิ์ก่อนจึงจะออกได้');askConfirm(`ออกจากห้อง "${roomNow()?.name||''}" ใช่หรือไม่?\\nข้อมูลนักเรียนและคะแนนจะไม่ถูกลบ และกลับเข้าได้ด้วยลิงก์เชิญใหม่`,'ออกจากห้อง',()=>doLeaveClassroom(),'ออกจากห้อง')}
async function doLeaveClassroom(){try{let {error}=await supa.rpc('teacher_leave_classroom',{p_classroom_id:activeRoom});if(error)throw error;await loadTeacher();view='overview';renderTeacher();toast('ออกจากห้องแล้ว เจ้าของห้องสามารถส่งลิงก์เชิญใหม่ได้')}catch(e){toast(friendlyErr(e))}}
function promoteTeacher(tid){let t=teachers.find(x=>x.teacher_id===tid);if(!t)return;askConfirm(`แต่งตั้ง "${t.name}" เป็นเจ้าของห้อง "${roomNow()?.name||''}" ?\nเจ้าของห้องมีสิทธิ์เท่ากับคุณ คือเชิญครู ลบครูท่านอื่น และลบห้องได้ และยกเลิกจากหน้านี้ไม่ได้`,'แต่งตั้งเป็นเจ้าของห้อง',()=>doPromoteTeacher(tid))}
async function doPromoteTeacher(tid){try{let {error}=await supa.rpc('owner_promote_teacher',{p_classroom_id:activeRoom,p_teacher_id:tid});if(error)throw error;await loadRoom();renderTeacher();toast('แต่งตั้งเป็นเจ้าของห้องแล้ว')}catch(e){toast(friendlyErr(e))}}
function removeTeacher(tid){let t=teachers.find(x=>x.teacher_id===tid);if(!t)return;askConfirm(`ลบ "${t.name}" ออกจากห้อง "${roomNow()?.name||''}" ?\nครูท่านนี้จะเข้าห้องนี้ไม่ได้อีกจนกว่าจะได้รับเชิญใหม่ และลิงก์เชิญเดิมของห้องนี้ทั้งหมดจะใช้ไม่ได้ (ต้องสร้างลิงก์ใหม่)`,'ลบออกจากห้อง',()=>doRemoveTeacher(tid))}
async function doRemoveTeacher(tid){try{let {error}=await supa.rpc('owner_remove_teacher',{p_classroom_id:activeRoom,p_teacher_id:tid});if(error)throw error;await loadRoom();renderTeacher();toast('ลบครูออกจากห้องแล้ว')}catch(e){toast(friendlyErr(e))}}
async function checkMembership(){
  if(isDemo()||!user||!activeRoom||previewMode||studentToken||_busy)return;
  let prev=activeRoom,prevName=roomNow()?.name||'';
  try{
    let {data,error}=await supa.from('classroom_members').select('classroom_id,role').eq('teacher_id',user.id);
    if(error||!data||prev!==activeRoom)return;
    let me=data.find(x=>x.classroom_id===prev);
    if(!me){await loadTeacher();view='overview';closeModal();renderTeacher();toast(`คุณถูกนำออกจากห้อง "${prevName}" แล้ว`);return}
    let r=roomNow();
    if(r&&r.my_role!==me.role){await loadTeacher();if(!$('#modalback').classList.contains('show'))renderTeacher();if(me.role==='owner')toast(`คุณได้รับแต่งตั้งเป็นเจ้าของห้อง "${prevName}" แล้ว`)}
  }catch(e){}
}
setInterval(checkMembership,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkMembership()});
guardOnce(['doPromoteTeacher','doRemoveTeacher']);

init().catch(e=>{console.error(e);$('#app').innerHTML=`<div class="shell"><section class="panel"><h2>เกิดข้อผิดพลาด</h2><p>${esc(e.message)}</p></section></div>`}).finally(()=>{setTimeout(()=>document.getElementById('startupSplash')?.classList.add('is-hidden'),220)});
</script>
